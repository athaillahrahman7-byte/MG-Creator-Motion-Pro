  <body class="bg-[#030407] text-[#F8FAFC] antialiased selection:bg-[#FF1E27] selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (function () {
        var isViteDev = !!document.querySelector('script[src*="@vite/client"]');
        var hasRawTsx = !!document.querySelector('script[src*="src/main.tsx"]');
        if (!isViteDev && hasRawTsx) {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './public/bundle/app.css';
          css.onerror = function () {
            var altCss = document.createElement('link');
            altCss.rel = 'stylesheet';
            altCss.href = './bundle/app.css';
            document.head.appendChild(altCss);
          };
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.src = './public/bundle/app.js';
          js.onerror = function () {
            var altJs = document.createElement('script');
            altJs.type = 'module';
            altJs.src = './bundle/app.js';
            document.body.appendChild(altJs);
          };
          document.body.appendChild(js);
        }
      })();
    </script>
